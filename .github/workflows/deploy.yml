name: Deploy to Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "=== 开始部署招商端数据看板 ==="
          
          # 进入部署目录
          cd /var/www/dashboard
          
          # 备份当前数据（以防万一）
          if [ -f dashboard-backend/data/clue_data.json ]; then
            cp dashboard-backend/data/clue_data.json /tmp/dashboard_data_backup_$(date +%Y%m%d_%H%M%S).json
            echo "✅ 数据已备份"
          fi
          
          # 拉取最新代码（先重置本地修改，避免冲突）
          git reset --hard HEAD
          git clean -fd
          git pull origin main || git pull origin master
          
          # 安装依赖
          cd dashboard-backend
          npm install --registry=https://registry.npmmirror.com
          
          # 重启服务
          pm2 restart dashboard-backend || pm2 start server.js --name dashboard-backend
          
          echo "=== 部署完成 ==="
          echo "部署时间: $(date)"
